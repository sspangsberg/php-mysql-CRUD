name: Deploy to Simply.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simply-com-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PHP application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Simply.com using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.simply.com
          port: 21
          protocol: ftps
          username: ${{ secrets.SIMPLY_FTP_USERNAME }}
          password: ${{ secrets.SIMPLY_FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.env
            **/.env.*
            **/*.sql
            **/*.md
            LICENSE